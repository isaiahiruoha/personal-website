<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found - Isaiah Iruoha</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/comp.png" type="image/png" sizes="512x512" />
    <style>
      :root { --bg: #f5f5f5; --text: #333333; --muted: #555555; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --text: #f5f5f5; --muted: #c4c4c4; --accent: #a5b4fc; } }
      * { margin: 0; box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; text-align: center; }
      h1 { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: clamp(48px, 12vw, 96px); letter-spacing: -0.05em; }
      p { margin-top: 12px; color: var(--muted); font-size: 16px; }
      a { display: inline-block; margin-top: 28px; padding: 12px 24px; border: 2px solid var(--text); border-radius: 999px; color: var(--text); text-decoration: none; font-size: 16px; }
      a:hover, a:focus-visible { background: var(--text); color: var(--bg); outline: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist.</p>
      <a href="/">&lt; Back home /&gt;</a>
    </main>
  </body>
</html>
